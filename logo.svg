<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#12b5d6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1b1640" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="18" y="14" width="220" height="220" rx="54" fill="url(#bg)"/>
  </g>
  <rect x="18" y="14" width="220" height="220" rx="54" fill="url(#gloss)"/>
  <rect x="18.5" y="14.5" width="219" height="219" rx="53.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
  <!-- terminal prompt -->
  <path d="M62 66 98 96 62 126" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M114 126h42" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
  <!-- toggle switch -->
  <rect x="148" y="58" width="58" height="34" rx="17" fill="#fff" fill-opacity=".28"/>
  <circle cx="189" cy="75" r="12.5" fill="#fff"/>
  <!-- slider -->
  <path d="M62 178h132" stroke="#fff" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>
  <path d="M62 178h74" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="138" cy="178" r="16" fill="#fff"/>
  <circle cx="138" cy="178" r="6" fill="#4f7cf0"/>
</svg>
